[tool:pytest]
testpaths = tests
addopts =
    --cov=app
    --cov=scripts.clean_skills_new
    --cov=scripts.clean_designations_new
    --cov=scripts.extract_occupations_new
    --cov=scripts.extract_resume
    --cov-report=term-missing
    --cov-fail-under=100

[coverage:run]
branch = False
omit =
    tests/*
    conftest.py

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
